<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Aurora Dunes</title><link rel="stylesheet" href="../interface.css"><style>:root{--bg:#132838;--ink:#e6e9db;--accent:#b3d7b7;--glass:color-mix(in srgb,var(--bg) 72%,transparent);--line:color-mix(in srgb,var(--ink) 22%,transparent)}</style></head><body class="aurora"><canvas aria-label="Aurora Dunes interactive artwork"></canvas><main class="ui"><div class="head "><small>06 / Polar studies</small><h1>Aurora<br>Dunes</h1><p class="hint">Sweep the sky. Leave a star.</p></div><div class="bottom "><div class="row hairline"><div class="spacer"><label class="row"><small>Wind</small><input aria-label="Wind" data-action="wind" type="range" min="-2" max="2" step=".01" value="0.5"></label></div><button class="" data-action="sky" data-value="">Pink dawn</button><button class="" data-action="reset" data-value="">New sky</button></div></div><div class="corner"><button class="icon" aria-label="Hide interface" data-action="quiet" data-value="">◌</button></div></main><button class="reveal" data-reveal aria-label="Show interface">◌</button><div id="error" role="alert"></div><script src="scene.js"></script><script src="../runtime.js"></script></body></html>
