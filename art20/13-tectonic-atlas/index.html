<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tectonic Atlas</title><link rel="stylesheet" href="../interface.css"><style>:root{--bg:#d8e3e6;--ink:#4c6268;--accent:#77865b;--glass:color-mix(in srgb,var(--bg) 72%,transparent);--line:color-mix(in srgb,var(--ink) 22%,transparent)}</style></head><body class="atlas"><canvas aria-label="Tectonic Atlas interactive artwork"></canvas><main class="ui"><div class="head "><small>13 / LANDSCAPE IN THE MAKING</small><h1>TECTONIC<br>ATLAS</h1></div><div class="side vertical"><button class="icon" data-action="mode" data-value="raise" data-group="mode" aria-pressed="true" aria-label="Raise terrain">＋</button><button class="icon" data-action="mode" data-value="carve" data-group="mode" aria-pressed="false" aria-label="Carve terrain">−</button><button class="icon" data-action="mode" data-value="smooth" data-group="mode" aria-pressed="false" aria-label="Smooth terrain">≈</button></div><div class="bottom "><div class="row hairline"><div class="spacer"><label class="row"><small>Turn</small><input aria-label="Turn" data-action="turn" type="range" min="-0.8" max="1.3" step=".01" value="0.4"></label></div><button class="" data-action="contour" data-value="">Contours on</button><button class="" data-action="reset" data-value="">New land</button></div><p class="hint" style="margin-top:12px">＋ Raise &nbsp; − Carve &nbsp; ≈ Smooth<br>Press the land with your finger.</p></div><div class="corner"><button class="icon" aria-label="Hide interface" data-action="quiet" data-value="">◌</button></div></main><button class="reveal" data-reveal aria-label="Show interface">◌</button><div id="error" role="alert"></div><script src="scene.js"></script><script src="../runtime.js"></script></body></html>
