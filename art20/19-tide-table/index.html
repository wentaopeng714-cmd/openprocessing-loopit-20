<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Tide Table</title><link rel="stylesheet" href="../interface.css"><style>:root{--bg:#e4dbc5;--ink:#3f6e70;--accent:#618f8c;--glass:color-mix(in srgb,var(--bg) 72%,transparent);--line:color-mix(in srgb,var(--ink) 22%,transparent)}</style></head><body class="tide"><canvas aria-label="Tide Table interactive artwork"></canvas><main class="ui"><div class="head "><small>POSTCARD No. 19</small><h1>Tide Table</h1><p class="hint">A shore that never stays the same.</p></div><div class="bottom "><div class="row hairline"><div class="spacer"><label class="row"><small>Tide</small><input aria-label="Tide" data-action="tide" type="range" min="0" max="1" step=".01" value="0.5"></label></div><button class="" data-action="shells" data-value="">Another shell</button></div><p class="hint" style="margin-top:12px">Move a shell. Draw on the sand.<br>The water will take its time.</p></div><div class="corner"><button class="icon" aria-label="Hide interface" data-action="quiet" data-value="">◌</button></div></main><button class="reveal" data-reveal aria-label="Show interface">◌</button><div id="error" role="alert"></div><script src="scene.js"></script><script src="../runtime.js"></script></body></html>
